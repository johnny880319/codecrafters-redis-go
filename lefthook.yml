# NOTE:
# These hooks assume a monorepo layout with `python/`, `go/`, and `typescript/` folders.
# If you rename folders or flatten language code to repository root, update each `root:` path below.

pre-commit:
  parallel: true
  commands:
    # go
    go-lint-typecheck:
      glob: "**/*.go"
      run: golangci-lint run --fix
      stage_fixed: true


pre-push:
  parallel: true
  commands:
    # go
    go-test:
      glob: "**/*.go"
      run: go test -short ./...
